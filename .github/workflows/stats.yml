name: Profile Stat Cards
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out the dedicated `metrics` branch so the generated cards are
      # committed there, keeping main's history clean.
      - name: Checkout metrics branch
        uses: actions/checkout@v4
        with:
          ref: metrics

      - name: Prepare output dir
        run: mkdir -p cards

      # Self-hosted replacement for the unreliable public github-readme-stats
      # instance (chronic 503). Cards are rendered to SVG in-CI and committed;
      # no runtime third-party dependency. Pinned to an immutable SHA.
      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=dz-vadim&show_icons=true&count_private=true&include_all_commits=true&hide_border=true&title_color=0E63CD&icon_color=0E63CD&theme=tokyonight
          path: cards/stats-dark.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=dz-vadim&show_icons=true&count_private=true&include_all_commits=true&hide_border=true&title_color=0E63CD&icon_color=0E63CD&theme=default
          path: cards/stats-light.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: username=dz-vadim&layout=compact&langs_count=8&hide_border=true&title_color=0E63CD&theme=tokyonight
          path: cards/top-langs-dark.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: username=dz-vadim&layout=compact&langs_count=8&hide_border=true&title_color=0E63CD&theme=default
          path: cards/top-langs-light.svg
          token: ${{ secrets.METRICS_TOKEN }}

      # Self-hosted replacement for the flaky public streak-stats instance,
      # via DenverCoder1's official GitHub Action (7k+ stars, maintained).
      - name: Streak card (dark)
        uses: DenverCoder1/github-readme-streak-stats@51cfb8879073b4c016ce6286016de0b14d179077 # v1.7.0
        with:
          options: user=dz-vadim&hide_border=true&theme=tokyonight&ring=0E63CD&fire=0E63CD&currStreakLabel=0E63CD
          path: cards/streak-dark.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Streak card (light)
        uses: DenverCoder1/github-readme-streak-stats@51cfb8879073b4c016ce6286016de0b14d179077 # v1.7.0
        with:
          options: user=dz-vadim&hide_border=true&ring=0E63CD&fire=0E63CD&currStreakLabel=0E63CD
          path: cards/streak-light.svg
          token: ${{ secrets.METRICS_TOKEN }}

      # Self-hosted replacement for the public activity-graph instance
      # (github-readme-activity-graph.vercel.app now returns 402
      # DEPLOYMENT_DISABLED). Upstream ships no Action, so build its tiny
      # Express server in-CI and fetch the SVGs locally. Pinned to a SHA.
      - name: Checkout activity-graph
        uses: actions/checkout@v4
        with:
          repository: Ashutosh00710/github-readme-activity-graph
          ref: 0962e9461de815933d462e8b98c7ce566cada8fb
          path: _activity-graph

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Activity graph (dark + light)
        env:
          TOKEN: ${{ secrets.METRICS_TOKEN }}
          PORT: 5100
        run: |
          cd _activity-graph
          npm ci --no-audit --no-fund
          npm run build
          node dist/main.js &
          for i in $(seq 30); do curl -fs -o /dev/null http://localhost:5100/ && break; sleep 1; done
          Q="username=dz-vadim&hide_border=true&bg_color=0000&color=0E63CD&line=0E63CD&point=0E63CD"
          curl -fsS "http://localhost:5100/graph?$Q&theme=tokyo-night" -o ../cards/activity-dark.svg
          curl -fsS "http://localhost:5100/graph?$Q&theme=github-light" -o ../cards/activity-light.svg
          grep -q '<svg' ../cards/activity-dark.svg && grep -q '<svg' ../cards/activity-light.svg

      - name: Commit cards to metrics branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/*.svg
          if git diff --cached --quiet; then
            echo "No card changes to commit."
          else
            git commit -m "Update stat cards - [Skip GitHub Action]"
            git push
          fi
