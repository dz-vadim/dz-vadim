name: GitHub Metrics
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - README.md
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          # Commit the generated SVG to a dedicated orphan branch so the daily
          # auto-commits never pollute main's history. README references it via
          # the raw URL of this branch.
          committer_branch: metrics
          user: dz-vadim
          template: classic
          filename: metrics-lecoq.svg
          config_timezone: Europe/Kyiv
          base: header

          # Full-year 3D contribution calendar — the unique self-hosted block.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          repositories_forks: true
          repositories_affiliations: owner,collaborator,organization_member
          repositories_skipped: dz-vadim/dz-vadim
          repositories_batch: 100
